# Loki (single binary, filesystem storage) for the exhibit kiosk.
# The control server pushes events to http://127.0.0.1:3100/loki/api/v1/push (labels app/host/type).
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: C:/dev/tools/monitoring/data/loki
  storage:
    filesystem:
      chunks_directory: C:/dev/tools/monitoring/data/loki/chunks
      rules_directory: C:/dev/tools/monitoring/data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 8760h          # keep a year of events
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  max_line_size: 1MB               # feedback snapshots are a few KB each

compactor:
  working_directory: C:/dev/tools/monitoring/data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://127.0.0.1:9093

analytics:
  reporting_enabled: false
