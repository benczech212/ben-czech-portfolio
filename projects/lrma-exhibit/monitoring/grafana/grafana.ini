; Grafana for the exhibit kiosk (portable install under C:\dev\tools\monitoring\grafana).
; Launched by the `grafana` app in exhibit.yaml with --homepath <install> --config <this file>.
[paths]
data = C:\dev\tools\monitoring\data\grafana
logs = C:\dev\tools\monitoring\data\grafana\logs
plugins = C:\dev\tools\monitoring\data\grafana\plugins
provisioning = C:\dev\leepa_rattner_exhibit_2026\monitoring\grafana\provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost

[security]
admin_user = admin
; admin_password is not stored here: set the GF_SECURITY_ADMIN_PASSWORD environment variable
; before Grafana first starts (it seeds the admin account on first run).

[auth.anonymous]
enabled = false

[users]
default_theme = dark

[dashboards]
default_home_dashboard_path = C:\dev\leepa_rattner_exhibit_2026\monitoring\grafana\dashboards\exhibit.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[log]
mode = file
level = warn
