# Camp Bus broker config — DEV PROFILE ("virtual camp"), used by docker-compose on the dev PC.
#
#   *** ANONYMOUS, NO ACL. Development only. ***
#
# The browser sim pages and the mock devices connect without credentials, so this profile
# lets anyone who can reach ports 1883/9001 publish anything (including cmd/# and
# mapping/set). Run it only on a trusted dev machine or an isolated network. The booth Pi
# uses bus/mosquitto.conf (password file + ACL) instead; see deploy/README.md.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true          # dev only - see header

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Fan-out never blocks: a slow/dead subscriber gets its own queue capped and
# messages dropped for IT, never for the publisher. Beat events are QoS 0 anyway.
max_queued_messages 200
max_inflight_messages 20
message_size_limit 65536

# A node that vanishes is marked offline by its last will; stale sessions expire.
persistent_client_expiration 1d

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
