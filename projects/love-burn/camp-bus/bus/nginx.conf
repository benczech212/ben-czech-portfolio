# Web UI for the sim: static files from ./sim, plus /clips/ proxied to the clip server
# so "Record clip" can save straight into the repo (no browser download dialog).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /clips/ {
        proxy_pass http://clips:8090/clips/;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
        # The sim is edited live and every page shares shared.js; a cached copy paired with a newer
        # page is how you get half-broken JS, so serve it fresh every time.
        add_header Cache-Control "no-store" always;
    }
}
