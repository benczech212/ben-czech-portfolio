# Camp Bus broker config — PRODUCTION PROFILE (booth Pi).
# On the Pi, copy to /etc/mosquitto/conf.d/campbus.conf and change
# persistence_location to /var/lib/mosquitto/ (see deploy/README.md).
#
# Every client authenticates and the ACL decides who may publish where. In particular only
# the `engine` and `booth` accounts may publish cmd/# (device effects) or mapping/set
# (rewrites the routing rules). The docker-compose "virtual camp" uses the anonymous
# bus/mosquitto.dev.conf instead.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false

# Create with: sudo mosquitto_passwd -c /etc/mosquitto/campbus.passwd engine
#              sudo mosquitto_passwd    /etc/mosquitto/campbus.passwd booth   (etc.)
password_file /etc/mosquitto/campbus.passwd

# Copy bus/acl.example to this path and adjust the device accounts.
acl_file /etc/mosquitto/campbus.acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Fan-out never blocks: a slow/dead subscriber gets its own queue capped and
# messages dropped for IT, never for the publisher. Beat events are QoS 0 anyway.
max_queued_messages 200
max_inflight_messages 20
message_size_limit 65536

# A node that vanishes is marked offline by its last will; stale sessions expire.
persistent_client_expiration 1d

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
