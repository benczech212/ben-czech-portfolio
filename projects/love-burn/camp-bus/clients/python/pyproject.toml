[project]
name = "campbus"
version = "0.1.0"
description = "AWEtisticats camp event bus - Python client for Pi-class nodes"
requires-python = ">=3.9"
dependencies = ["paho-mqtt>=2.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["campbus"]
